# Modbus Integration
modbus:
  - name: sprsun_carel
    type: tcp
    host: 192.168.8.205
    port: 502
    delay: 5 
    timeout: 30
    retries: 3
    message_wait_milliseconds: 1500
    
    switches:
      - name: "Zasilanie Pompy"
        slave: 1
        address: 40
        write_type: coil

    binary_sensors:
      - name: "Status Jednostki"
        slave: 1
        address: 0
        input_type: discrete_input
        
      - name: "Praca Sprezarki"
        slave: 1
        address: 6
        input_type: discrete_input
        device_class: running
        
      - name: "Pompa Obiegowa"
        slave: 1
        address: 8
        input_type: discrete_input
        device_class: running

    sensors:
      - name: "Tryb Pracy (Odczyt surowy)"
        slave: 1
        address: 0
        input_type: holding
        data_type: int16

      - name: "Temp. Powrotu"
        slave: 1
        address: 188
        input_type: holding
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
        precision: 1
        data_type: int16
        
      - name: "Temp. Zasilania"
        slave: 1
        address: 189
        input_type: holding
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
        precision: 1
        data_type: int16
        
      - name: "Temp. Zewnetrzna"
        slave: 1
        address: 190
        input_type: holding
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
        precision: 1
        data_type: int16
        
      - name: "Temp. CWU (Bojler)"
        slave: 1
        address: 195
        input_type: holding
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
        precision: 1
        data_type: int16

      - name: "Odczyt Nastawy CO"
        slave: 1
        address: 1
        input_type: holding
        scale: 0.1
        unit_of_measurement: "°C"
        precision: 1
        data_type: int16
        
      - name: "Odczyt Nastawy CWU"
        slave: 1
        address: 3
        input_type: holding
        scale: 0.1
        unit_of_measurement: "°C"
        precision: 1
        data_type: int16

      - name: "Prąd Sprężarki"
        slave: 1
        address: 335
        input_type: holding
        scale: 0.1
        unit_of_measurement: "A"
        precision: 1
        data_type: int16
        scan_interval: 5

# Energy Tracking & Calculations
sensor:
  - platform: integration
    source: sensor.pobor_mocy_pompy
    name: Energia Pompy Suma
    unit_prefix: k
    unit_time: h
    method: trapezoidal
    round: 2

template:
  - sensor:
      - name: "Pobór mocy pompy"
        unique_id: pobor_mocy_pompy
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ (states('sensor.prad_sprezarki') | float(0) * 230) | int }}

  - switch:
      - name: "Zasilanie pompy smart"
        unique_id: zasilanie_pompy_smart
        state: >
          {{ is_state('binary_sensor.status_jednostki', 'on') }}
        turn_on:
          - action: switch.turn_on
            target:
              entity_id: switch.zasilanie_pompy
        turn_off:
          - action: switch.turn_off
            target:
              entity_id: switch.zasilanie_pompy

utility_meter:
  zuzycie_pompy_dzien:
    source: sensor.energia_pompy_suma
    cycle: daily
  zuzycie_pompy_tydzien:
    source: sensor.energia_pompy_suma
    cycle: weekly
  zuzycie_pompy_miesiac:
    source: sensor.energia_pompy_suma
    cycle: monthly
  zuzycie_pompy_rok:
    source: sensor.energia_pompy_suma
    cycle: yearly

# User Interface / Controls
input_select:
  tryb_pracy_pompy:
    name: "Tryb pracy pompy"
    options:
      - "Chłodzenie"
      - "Ogrzewanie"
      - "CWU"
      - "CWU + Chłodzenie"
      - "CWU + Ogrzewanie"
    icon: mdi:sync

input_number:
  nastawa_co:
    name: "Nastawa CO"
    min: 20
    max: 55
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer-lines
    mode: box
    
  nastawa_cwu:
    name: "Nastawa CWU"
    min: 30
    max: 60
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:water-boiler
    mode: box
